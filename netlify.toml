# Static site: no build step, publish the repo root.
[build]
  publish = "."

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL for the thank-you page (Netlify usually does this already; explicit is safer).
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# NLP Lab: three.js never changes; the model data rarely does.
[[headers]]
  for = "/nlp/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/nlp/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
